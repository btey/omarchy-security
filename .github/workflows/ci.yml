# SPDX-License-Identifier: MIT
#
# Builds the daemon, helper and eBPF monitor, runs `make lint test`, and
# uploads the release tarballs (plan task 5.1). A tag v<version> also
# publishes them as a GitHub release (plan task 5.2), and the plugin in its
# own repository (plan task 5.3).
#
# It runs in an archlinux container switched to Omarchy's package mirror,
# which trails Arch's, and builds only with packages from it: pacman's rust,
# rust-src and bpf-linker, which all link that mirror's LLVM (plan §5.0).
# So the release binaries need nothing newer than an Omarchy machine has
# (glibc included), and the build is the one `backend/install.sh
# --from-source` does there without rustup. The container is privileged, and the tests run as an unprivileged
# user, so the tests that need `unshare -rn`, bwrap, gocryptfs and a private
# D-Bus run here as they do on a desktop instead of skipping themselves; the
# job fails if any test reports a skip.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_HOME: /opt/cargo
  CARGO_TERM_COLOR: always
  # Themes for the palette test and the shell qmllint resolves `qs.*` against.
  OMARCHY_REF: v4.0.4
  OMARCHY_PATH: /opt/omarchy
  # Omarchy's /etc/pacman.d/mirrorlist.
  OMARCHY_MIRROR: https://stable-mirror.omarchy.org/$repo/os/$arch

jobs:
  build-test:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
      # Privileged for user namespaces, FUSE and nftables in the tests; the
      # host's modules so the NFQUEUE test can load nfnetlink_queue.
      options: --privileged -v /lib/modules:/lib/modules:ro
    steps:
      - name: Install system packages from Omarchy's mirror
        id: packages
        run: |
          echo "Server = $OMARCHY_MIRROR" > /etc/pacman.d/mirrorlist
          # -uu moves the image's newer packages back to the mirror's.
          pacman -Syyuu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git rust rust-src bpf-linker llvm clang python nodejs qt6-declarative \
            dbus util-linux nftables bubblewrap iproute2 gocryptfs fuse3 kmod jq
          pacman -Q glibc llvm rust bpf-linker
          echo "rust=$(pacman -Q rust | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Prepare the test user and kernel
        run: |
          useradd --create-home ci
          git config --global --add safe.directory '*'
          # zbus and dbus-daemon read it; the image has none.
          systemd-machine-id-setup
          install -d -o ci -g ci "$CARGO_HOME"
          # Runs a command as `ci`, keeping the environment (PATH, CARGO_HOME).
          printf '#!/bin/sh\nexec setpriv --reuid=ci --regid=ci --init-groups env HOME=/home/ci USER=ci LOGNAME=ci "$@"\n' \
            > /usr/local/bin/as-ci
          chmod 755 /usr/local/bin/as-ci
          # Ubuntu's AppArmor refuses unprivileged user namespaces, which
          # `unshare -rn` and bwrap need. The runner is thrown away after.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 > /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          modprobe -a nfnetlink_queue nft_queue || echo "modprobe failed; relying on autoload"
          # Docker mounts /dev/shm noexec; the threat tests run a binary
          # planted there, as a desktop's /dev/shm allows.
          mount -o remount,exec /dev/shm
          as-ci unshare -rn true
          as-ci bwrap --unshare-all --ro-bind / / true

      - uses: actions/checkout@v7

      - name: Fetch Omarchy ${{ env.OMARCHY_REF }}
        run: git clone --quiet --depth 1 --branch "$OMARCHY_REF" https://github.com/basecamp/omarchy "$OMARCHY_PATH"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            target
            crates/omarchy-security-ebpf/target
            fuzz/target
          # A new rust rebuilds everything anyway.
          key: cargo-${{ steps.packages.outputs.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ steps.packages.outputs.rust }}-

      - name: Hand the workspace to the test user
        run: chown -R ci:ci . "$CARGO_HOME"

      # The rustup path (`make ebpf` with EBPF_RUST=rustup) needs a nightly
      # on the system's LLVM, listed in the Makefile; say when Omarchy's
      # LLVM has moved past those.
      - name: Check the Makefile lists a nightly for this LLVM
        run: |
          llvm=$(llvm-config --version | cut -d. -f1)
          grep -q "^EBPF_NIGHTLY_LLVM$llvm :=" Makefile ||
            echo "::warning::Omarchy's mirror is on LLVM $llvm, and the Makefile lists no EBPF_NIGHTLY_LLVM$llvm for rustup builds (plan §5.0)."

      - name: Build the eBPF monitor
        run: as-ci make ebpf

      - name: Lint
        run: as-ci make lint

      - name: Test
        run: |
          set -o pipefail
          as-ci make test RUST_TEST_ARGS=--nocapture 2>&1 | tee test.log
          # Rust tests print "...; skipping", node "skipped N", unittest "skipped=N".
          if grep -nE '; skipping$|skipped [1-9]|skipped=[1-9]' test.log; then
            echo "::error::Tests skipped themselves (above): a tool or kernel feature is missing in CI."
            exit 1
          fi

      - name: Build release binaries
        run: as-ci make release

      # On a tag, `version-check` also compares it with the version.
      - name: Package
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: as-ci make dist TAG="$TAG"

      - uses: actions/upload-artifact@v7
        with:
          name: omarchy-security-${{ github.sha }}
          path: target/dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: omarchy-security-${{ github.sha }}
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # The version's CHANGELOG section, without its heading.
          awk -v v="$version" '$1 == "##" { if (found) exit; found = ($2 == v); next } found' \
            CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Omarchy Security Hub $version" --notes-file notes.md release/*

  # The plugin at the root of its own repository, which `omarchy plugin
  # add` needs (plan task 5.3, §5.22). After `release`, since the plugin's
  # backend installer downloads that release. Pushed with a deploy key
  # that can write only to that repository; without the secret (a fork)
  # the job says so and succeeds. Plain pushes only: `omarchy plugin
  # update` fast-forwards.
  plugin-repo:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    env:
      PLUGIN_REPO: btey/omarchy-security-hub-plugin
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: omarchy-security-${{ github.sha }}
          path: release

      - name: Publish the plugin repository
        env:
          DEPLOY_KEY: ${{ secrets.PLUGIN_REPO_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::notice::PLUGIN_REPO_DEPLOY_KEY is not set; $PLUGIN_REPO not updated"
            exit 0
          fi
          version=${GITHUB_REF_NAME#v}
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/plugin_repo
          chmod 600 ~/.ssh/plugin_repo
          # GitHub's host keys, from its API over HTTPS rather than trusted
          # on first use.
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/plugin_repo -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone --quiet "git@github.com:$PLUGIN_REPO.git" plugin
          cd plugin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Always main; a new, empty repository has no branch yet.
          if git rev-parse -q --verify refs/remotes/origin/main >/dev/null; then
            git checkout -q -B main origin/main
          else
            git symbolic-ref HEAD refs/heads/main
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::notice::$PLUGIN_REPO already has v$version"
            exit 0
          fi
          # The plugin tarball's files, and nothing else.
          git rm -rq --ignore-unmatch .
          tar -xzf "../release/security-hub-$version.tar.gz" --strip-components=1 -C .
          git add -A
          git diff --cached --quiet || git commit -q -m "Security Hub $version" \
            -m "From $GITHUB_REPOSITORY@$GITHUB_SHA ($GITHUB_REF_NAME)."
          git tag -a "v$version" -m "Security Hub $version"
          # Both or neither: a tag without its commit on main would stop the
          # next run.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$version"
