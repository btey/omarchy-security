[package]
name = "omarchy-security-ebpf"
description = "eBPF exec monitor loaded by omarchy-securityd-helper"
version = "1.1.8"
edition = "2024"
license = "GPL-2.0-only"
publish = false

# Not a workspace member: it builds for bpfel-unknown-none with nightly
# (see rust-toolchain.toml and .cargo/config.toml). `make ebpf` builds it.
[workspace]

[dependencies]
aya-ebpf = "0.2"

[[bin]]
name = "exec-monitor"
path = "src/main.rs"

[profile.dev]
panic = "abort"
opt-level = 2
debug = 2

[profile.release]
panic = "abort"
debug = 2
