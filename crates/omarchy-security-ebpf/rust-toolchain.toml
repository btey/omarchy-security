# The bpf target needs build-std, which needs nightly and rust-src.
#
# bpf-linker links against the system LLVM (22 on Arch as of this pin) and
# cannot read bitcode from a newer LLVM, so the nightly is pinned to the last
# one on LLVM 22. When the system moves to LLVM 23, move this to a newer
# nightly and reinstall bpf-linker.
[toolchain]
channel = "nightly-2026-08-01"
components = ["rust-src"]
